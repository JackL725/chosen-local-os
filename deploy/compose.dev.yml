# Local development: Postgres 16 and n8n, reachable from this machine only.
#   docker compose -f deploy/compose.dev.yml up -d
# Then: dbmate up   (DATABASE_URL from .env.example)
# n8n editor: http://localhost:5678
name: chosen-local-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cl
      POSTGRES_PASSWORD: devpassword        # dev only; matches .env.example
      POSTGRES_DB: chosen_local_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/dev-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cl -d chosen_local_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.35.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n_dev
      DB_POSTGRESDB_USER: cl
      DB_POSTGRESDB_PASSWORD: devpassword
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"           # dev over plain http on localhost only
      GENERIC_TIMEZONE: America/Denver
      TZ: America/Denver
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  pgdata:
  n8n_data:
