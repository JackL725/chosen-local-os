# Production on the VPS (Ubuntu 24.04). Run from /opt/chosen-local-vps (deploy/README.md).
#   docker compose -f deploy/compose.prod.yml --env-file /etc/chosen-local/vps.env up -d
#   ...plus `--profile public` once the domain exists (adds Caddy on 80/443).
#
# Nothing here listens on a public interface except Caddy (profile "public"), which
# proxies only n8n's webhook and form paths. Postgres and the n8n editor are published
# on 127.0.0.1 only; Tailscale serve exposes them to the tailnet (deploy/README.md),
# and that configuration persists across reboots.
name: chosen-local

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in vps.env}
      LEDGER_OWNER_PASSWORD: ${LEDGER_OWNER_PASSWORD:?set in vps.env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set in vps.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:${N8N_VERSION:?pin the n8n version in vps.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in vps.env}
      N8N_PORT: "5678"
      N8N_HOST: ${N8N_PUBLIC_HOST:-localhost}
      N8N_PROTOCOL: https
      N8N_PROXY_HOPS: "1"
      # Public webhook base (Caddy). Both names: WEBHOOK_URL is the deprecated alias.
      N8N_WEBHOOK_URL: https://${N8N_PUBLIC_HOST:-localhost}/
      WEBHOOK_URL: https://${N8N_PUBLIC_HOST:-localhost}/
      # Editor: tailnet only, via `tailscale serve --https=8443`.
      N8N_EDITOR_BASE_URL: https://${VPS_TAILNET_NAME:?set in vps.env}:8443/
      GENERIC_TIMEZONE: America/Denver
      TZ: America/Denver
      # Execution data: nothing saved for successful runs; errors kept 7 days, then pruned.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "10000"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HIRING_BANNER_ENABLED: "false"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    profiles: ["public"]
    build: ./caddy
    restart: unless-stopped
    depends_on: [n8n]
    environment:
      N8N_PUBLIC_HOST: ${N8N_PUBLIC_HOST:?set the public webhook host in vps.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
