[project]
name = "chosen-local-os"
version = "0.1.0"
description = "The AI operating system for Chosen Local: worker, review console and evals."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pre-commit>=3.8",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]
ignore = [
    "S101",  # assert is how pytest works
    "S603",  # subprocess with a fixed argv
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres 16 database at TEST_DATABASE_URL (skipped when it is unset)",
    "local_model: needs llama-server at LOCAL_LLM_BASE_URL (skipped unless RUN_LOCAL_MODEL_TESTS=1)",
]
addopts = "-ra"
