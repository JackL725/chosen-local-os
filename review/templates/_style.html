<style>
  :root {
    --bg: #f6f5f2; --panel: #ffffff; --ink: #1d1f22; --muted: #5e646d; --line: #dedbd3;
    --accent: #1f5f8b; --accent-ink: #ffffff; --ok-bg: #e5f3ea; --ok-ink: #1e5b35;
    --err-bg: #fbe9e7; --err-ink: #8a2a1d; --warn-bg: #fff4d6; --warn-ink: #6b4b00;
    --chip: #eceae4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b; --panel: #1f2226; --ink: #e8e6e1; --muted: #a2a8b0; --line: #34383e;
      --accent: #6aaee0; --accent-ink: #0d1114; --ok-bg: #173323; --ok-ink: #a6e2bb;
      --err-bg: #3a1c17; --err-ink: #f2b4a8; --warn-bg: #3a3014; --warn-ink: #f0d58a;
      --chip: #2b2f34;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  a { color: var(--accent); }
  header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 18px;
               padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header.top .brand { font-weight: 650; margin-right: 8px; }
  header.top nav { display: flex; flex-wrap: wrap; gap: 2px 14px; flex: 1; }
  header.top nav a { text-decoration: none; color: var(--muted); padding: 4px 0; }
  header.top nav a.here { color: var(--ink); border-bottom: 2px solid var(--accent); }
  header.top .who { color: var(--muted); font-size: 13px; display: flex; gap: 10px; align-items: center; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px 20px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 8px; }
  p.lede { color: var(--muted); margin: 0 0 18px; max-width: 70ch; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin: 0 0 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
  .stat .n { font-size: 26px; font-weight: 650; }
  .stat .l { color: var(--muted); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; margin: 1px 2px 1px 0; }
  .chip.on, .chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .chip.off, .chip.err { background: var(--err-bg); color: var(--err-ink); }
  .chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
  .flash { padding: 10px 14px; border-radius: 8px; margin: 0 0 16px; }
  .flash.ok { background: var(--ok-bg); color: var(--ok-ink); }
  .flash.error { background: var(--err-bg); color: var(--err-ink); }
  form.inline { display: inline; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number], input[type=email], input[type=url], select, textarea {
    width: 100%; max-width: 520px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); font: inherit; }
  textarea { min-height: 70px; }
  input[type=file] { font: inherit; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: var(--accent-ink); cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button.danger { background: transparent; color: var(--err-ink); border-color: var(--err-ink); }
  .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-end; }
  .row > * { flex: 0 1 auto; }
  details summary { cursor: pointer; color: var(--accent); }
  code { font-size: 13px; background: var(--chip); padding: 1px 5px; border-radius: 4px; }
  @media (max-width: 640px) { th:nth-child(n+4), td:nth-child(n+4) { display: none; } }
</style>
