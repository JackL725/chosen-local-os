name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: n8n workflows go through send-gate and carry no credentials
        run: uv run python scripts/check_n8n_workflows.py

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cl
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: chosen_local_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cl" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI has no local model: the unit and DB suites use tests/fakes/fake_llm.py.
      TEST_DATABASE_URL: postgres://cl:ci-only-password@localhost:5432/chosen_local_test
      DBMATE_URL: postgres://cl:ci-only-password@localhost:5432/chosen_local_dbmate?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Install dbmate
        run: |
          sudo curl -fsSL -o /usr/local/bin/dbmate \
            https://github.com/amacneil/dbmate/releases/download/v2.36.0/dbmate-linux-amd64
          sudo chmod +x /usr/local/bin/dbmate
      - name: Migrations apply, roll back and reapply on an empty database
        run: |
          dbmate --url "$DBMATE_URL" --no-dump-schema create
          dbmate --url "$DBMATE_URL" --no-dump-schema up
          dbmate --url "$DBMATE_URL" --no-dump-schema down
          dbmate --url "$DBMATE_URL" --no-dump-schema up
      - run: uv run pytest -q
